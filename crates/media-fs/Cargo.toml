[package]
name = "eventrent-media-fs"
version = "0.1.0"
edition = "2021"
authors = ["EventRent Team"]
description = "Content-addressed filesystem MediaStore implementation for EventRent (ADR-0013)"

[dependencies]
eventrent-core = { path = "../core" }
async-trait = "0.1"
uuid = { version = "1.10", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
