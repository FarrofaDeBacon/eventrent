[package]
name = "eventrent-backup-fs"
version = "0.1.0"
edition = "2021"
authors = ["EventRent Team"]
description = "Transactional offline-first backup and restore engine for EventRent (ADR-0017)"

[dependencies]
eventrent-core = { path = "../core" }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
tracing = "0.1"
uuid = { version = "1.10", features = ["v7"] }
