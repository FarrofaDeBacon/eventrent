[package]
name = "eventrent-core"
version = "0.1.0"
edition = "2021"
authors = ["EventRent Team"]
description = "Database-agnostic core domain, business rules, services and store traits (ports) for EventRent"

[dependencies]
async-trait = "0.1"
argon2 = "0.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "time"] }
base64 = "0.22"
imagesize = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
