name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Check & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar congelamento das migrações 0001 e 0002
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }}
          MODIFIED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^crates/store-sqlite/migrations/000[12]_' || true)
          if [ -n "$MODIFIED" ]; then
            echo "::error::As migrações 0001 e 0002 foram congeladas e não podem ser modificadas:"
            echo "$MODIFIED"
            echo "Crie uma nova migração (ex: 0003_...) para qualquer evolução de esquema."
            exit 1
          fi
          echo "Migrações 0001 e 0002 intactas."

      - name: Prova estrutural do script de congelamento das migrações
        run: node scripts/test-check-migrations.js

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache do Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Instalar dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          standalone: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependências Frontend
        run: pnpm install

      - name: SvelteKit Check & Typecheck
        run: pnpm check

      - name: Lint de Código
        run: pnpm lint

      - name: Testes Unitários Frontend (Vitest)
        run: pnpm test:run

      - name: Cache dos Navegadores Playwright
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Instalar navegador Playwright (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes E2E (Playwright)
        if: runner.os == 'Linux'
        run: pnpm test:e2e

      - name: Rustfmt Check
        run: cargo fmt --all --check

      - name: Clippy Linter
        run: cargo clippy --workspace -- -D warnings

      - name: Testes Unitários Rust
        run: cargo test --workspace
