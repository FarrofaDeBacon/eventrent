name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Check & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar congelamento das migrações existentes na main
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }}
          node scripts/check-migrations.js origin/${{ github.base_ref }}

      - name: Prova estrutural do congelamento dinâmico de migrações
        run: node scripts/test-check-migrations.js

      - name: Prova estrutural de snippets em relatórios
        run: node scripts/test-check-report-snippets.js

      - name: Verificação de snippets em relatórios
        run: node scripts/check-report-snippets.js

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache do Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Instalar dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          standalone: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependências Frontend
        run: pnpm install

      - name: SvelteKit Check & Typecheck
        run: pnpm check

      - name: Lint de Código
        run: pnpm lint

      - name: Testes Unitários Frontend (Vitest)
        run: pnpm test:run

      - name: Build Frontend de Produção (sem mocks)
        run: pnpm build

      - name: Verificação Estática de Ausência de Mocks no Pacote
        run: node scripts/check-no-mocks-in-build.js

      - name: Cache dos Navegadores Playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Instalar navegador Playwright (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Instalar navegador Playwright (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium

      - name: Testes E2E (Playwright)
        run: pnpm test:e2e

      - name: Rustfmt Check
        run: cargo fmt --all --check

      - name: Clippy Linter
        run: cargo clippy --workspace -- -D warnings

      - name: Testes Unitários Rust
        run: cargo test --workspace

  compilar-app:
    name: Compilação Real do App Tauri (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-cargo-tauri-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-tauri-build-

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          standalone: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependências Frontend
        run: pnpm install

      - name: Compilar App Tauri Real (sem mocks, sem VITE_E2E)
        run: pnpm tauri build --no-bundle
