name: CI

on:
  push:
    branches: [main, fase-0-fundacao]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Check & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache do Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Instalar dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          standalone: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependências Frontend
        run: pnpm install

      - name: SvelteKit Check & Typecheck
        run: pnpm check

      - name: Lint de Código
        run: pnpm lint

      - name: Testes Unitários Frontend (Vitest)
        run: pnpm test:run

      - name: Rustfmt Check
        run: cargo fmt --all --check

      - name: Clippy Linter
        run: cargo clippy --workspace -- -D warnings

      - name: Testes Unitários Rust
        run: cargo test --workspace
